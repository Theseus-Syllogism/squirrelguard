# Camstack single sign-on: every web UI as https://<name>.cam.example.org (DNS *.cam -> 198.51.100.20 at Njalla),
# one Let's Encrypt wildcard certificate (portal/renew-cert.sh), and Authelia deciding every request (auth_request).
# Backends listen on 127.0.0.1 only, so this is the only way in. ntfy keeps its own token auth (phone app).
# Installed as /etc/nginx/sites-available/camstack-sso.conf by portal/install-sso.sh.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# ---------- shared pieces ----------
# (inline instead of snippets so the file is self-contained)

server {
    listen 198.51.100.20:80;
    server_name cam.example.org *.cam.example.org;
    return 301 https://$host$request_uri;
}

# ---------- Authelia sign-in portal ----------
server {
    listen 198.51.100.20:443 ssl http2;
    server_name auth.cam.example.org;
    include /etc/nginx/camstack/sso-tls.conf;
    location / {
        proxy_pass http://127.0.0.1:9091;
        proxy_set_header Host $host;
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# ---------- portal (static page + live frame) ----------
server {
    listen 198.51.100.20:443 ssl http2;
    server_name cam.example.org;
    include /etc/nginx/camstack/sso-tls.conf;
    include /etc/nginx/camstack/sso-authz.conf;
    root /srv/camstack/portal/www;
    index index.html;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location = /status.json { include /etc/nginx/camstack/sso-check.conf; add_header Cache-Control "no-store" always; try_files $uri =404; }
    location ~ ^/(live(?:_[a-z0-9]+)?\.jpg)$ { include /etc/nginx/camstack/sso-check.conf; alias /srv/camstack/portal/snap/$1; add_header Cache-Control "no-store" always; }
    location / { include /etc/nginx/camstack/sso-check.conf; try_files $uri $uri/ =404; }
}

# ---------- Frigate (gpuserver, via the 10.42 switch; Frigate trusts the user/role headers + X-Proxy-Secret) ----------
server {
    listen 198.51.100.20:443 ssl http2;
    server_name frigate.cam.example.org;
    include /etc/nginx/camstack/sso-tls.conf;
    include /etc/nginx/camstack/sso-authz.conf;
    client_max_body_size 50m;
    location / {
        include /etc/nginx/camstack/sso-check.conf;
        include /etc/nginx/camstack/sso-proxy.conf;
        include /etc/nginx/camstack/frigate-secret.conf;     # proxy_set_header X-Proxy-Secret ...; (not in git)
        proxy_pass https://192.0.2.30:8971;
        proxy_ssl_verify off;                                 # Frigate's self-signed cert, private link
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}

# ---------- people & vehicles review (persons-ui) ----------
server {
    listen 198.51.100.20:443 ssl http2;
    server_name persons.cam.example.org;
    include /etc/nginx/camstack/sso-tls.conf;
    include /etc/nginx/camstack/sso-authz.conf;
    # signed one-tap links from alerts: the HMAC in the URL is the authorisation
    location /act/ {
        proxy_set_header Remote-User "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8092;
    }
    location / {
        include /etc/nginx/camstack/sso-check.conf;
        include /etc/nginx/camstack/sso-proxy.conf;
        proxy_pass http://127.0.0.1:8092;
    }
}

# ---------- Grafana (auth.proxy trusts Remote-User from 127.0.0.1) ----------
server {
    listen 198.51.100.20:443 ssl http2;
    server_name grafana.cam.example.org;
    include /etc/nginx/camstack/sso-tls.conf;
    include /etc/nginx/camstack/sso-authz.conf;
    location / {
        include /etc/nginx/camstack/sso-check.conf;
        include /etc/nginx/camstack/sso-proxy.conf;
        proxy_pass http://127.0.0.1:3001;
    }
}

# ---------- File Browser (auth.method=proxy, header Remote-User) ----------
server {
    listen 198.51.100.20:443 ssl http2;
    server_name files.cam.example.org;
    include /etc/nginx/camstack/sso-tls.conf;
    include /etc/nginx/camstack/sso-authz.conf;
    client_max_body_size 0;
    location / {
        include /etc/nginx/camstack/sso-check.conf;
        include /etc/nginx/camstack/sso-proxy.conf;
        proxy_pass http://127.0.0.1:8091;
        proxy_buffering off;
    }
}

# ---------- go2rtc (its own login removed; reachable only through here) ----------
server {
    listen 198.51.100.20:443 ssl http2;
    server_name streams.cam.example.org;
    include /etc/nginx/camstack/sso-tls.conf;
    include /etc/nginx/camstack/sso-authz.conf;
    location / {
        include /etc/nginx/camstack/sso-check.conf;
        include /etc/nginx/camstack/sso-proxy.conf;
        proxy_pass http://127.0.0.1:1984;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}

# ---------- Uptime Kuma (its own login disabled; reachable only through here) ----------
server {
    listen 198.51.100.20:443 ssl http2;
    server_name uptime.cam.example.org;
    include /etc/nginx/camstack/sso-tls.conf;
    include /etc/nginx/camstack/sso-authz.conf;
    location / {
        include /etc/nginx/camstack/sso-check.conf;
        include /etc/nginx/camstack/sso-proxy.conf;
        proxy_pass http://127.0.0.1:3002;
        proxy_read_timeout 3600s;
    }
}

# ---------- ntfy (NOT behind SSO: the phone app signs in with its own user/token) ----------
server {
    listen 198.51.100.20:443 ssl http2;
    server_name ntfy.cam.example.org;
    include /etc/nginx/camstack/sso-tls.conf;
    client_max_body_size 12m;
    location / {
        include /etc/nginx/camstack/sso-proxy.conf;
        proxy_pass http://127.0.0.1:8090;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
