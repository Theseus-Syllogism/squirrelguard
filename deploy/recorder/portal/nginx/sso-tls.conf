# wildcard certificate for cam.example.org + *.cam.example.org (portal/renew-cert.sh keeps it current)
ssl_certificate     /etc/nginx/camstack/sso/fullchain.pem;
ssl_certificate_key /etc/nginx/camstack/sso/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:camstack_sso:2m;
add_header Strict-Transport-Security "max-age=31536000" always;
